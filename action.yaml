name: 'Download file from URL and cache it in GitHub Actions'
description: 'This GitHub Action downloads a file from a specified URL and caches it to avoid repeated downloads on subsequent runs.'
branding:
  icon: 'download'
  color: 'green'
inputs:
  url:
    description: 'URL of the file to download'
    required: true
  destination:
    description: 'Destination directory to save the downloaded file'
    required: false
    default: 'temp'
  filename:
    description: 'Set the name of the downloaded file'
    required: false
    default: ''
  sha256:
    description: 'Expected SHA256 hash of the file (hex string). If provided, the downloaded or cached file will be verified against this hash. The action fails if they do not match.'
    required: false
    default: ''
outputs:
  filename:
    description: 'Name of the downloaded file'
    value: ${{ steps.get-filename.outputs.filename }}
  filepath:
    description: 'Path to the downloaded file'
    value: ${{ steps.set-output.outputs.filepath }}
runs:
  using: 'composite'
  steps:
    - name: Validate URL and get file name
      id: get-filename
      shell: bash
      env:
        INPUT_FILENAME: ${{ inputs.filename }}
        INPUT_URL: ${{ inputs.url }}
      run: |
        case "$INPUT_URL" in
          ''|*$'\n'*|*$'\r'*)
            echo "Invalid URL: it must be non-empty and cannot contain line breaks" >&2
            exit 1
            ;;
        esac

        if [ -n "$INPUT_FILENAME" ]; then
          filename=$INPUT_FILENAME
        else
          filename=$(basename -- "$INPUT_URL")
        fi

        case "$filename" in
          ''|'.'|'..'|*/*|*'\'*|*\**|*\?*|*\[*|*\]*|*$'\n'*|*$'\r'*)
            echo "Invalid filename: it must be a single, non-empty path component without glob characters" >&2
            exit 1
            ;;
        esac

        printf 'filename=%s\n' "$filename" >> "$GITHUB_OUTPUT"
    - name: Set output path and cache key
      id: set-output
      shell: bash
      env:
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_URL: ${{ inputs.url }}
        FILENAME: ${{ steps.get-filename.outputs.filename }}
      run: |
        case "$INPUT_DESTINATION" in
          *$'\n'*|*$'\r'*|*'\'*|*\**|*\?*|*\[*|*\]*|'#'*|'!'*|'~'|'~/'*)
            echo "Invalid destination: line breaks, backslashes, glob characters, and leading #, !, or ~ are not allowed" >&2
            exit 1
            ;;
        esac

        if [ -n "$INPUT_SHA256" ]; then
          if [[ ! "$INPUT_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Invalid SHA256: expected exactly 64 hexadecimal characters" >&2
            exit 1
          fi
          expected_sha256=$(printf '%s' "$INPUT_SHA256" | tr '[:upper:]' '[:lower:]')
          cache_key=download-file-$expected_sha256
        else
          expected_sha256=
          url_sha256=$(printf '%s' "$INPUT_URL" | sha256sum)
          url_sha256=${url_sha256%% *}
          cache_key=download-url-$url_sha256
        fi

        mkdir -p -- "$INPUT_DESTINATION"

        printf 'filepath=%s/%s\n' "$INPUT_DESTINATION" "$FILENAME" >> "$GITHUB_OUTPUT"
        printf 'expected_sha256=%s\n' "$expected_sha256" >> "$GITHUB_OUTPUT"
        printf 'cache_key=%s\n' "$cache_key" >> "$GITHUB_OUTPUT"
    - name: Check cache
      id: cache
      uses: actions/cache/restore@v5
      with:
        key: ${{ steps.set-output.outputs.cache_key }}
        path: ${{ steps.set-output.outputs.filepath }}
    - if: steps.cache.outputs.cache-hit != 'true'
      name: Download file
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        FILEPATH: ${{ steps.set-output.outputs.filepath }}
      run: |
        curl --retry 5 --connect-timeout 30 --location --globoff \
          --output "$FILEPATH" \
          -- "$INPUT_URL"
    - name: Verify SHA256
      if: inputs.sha256 != ''
      shell: bash
      env:
        FILEPATH: ${{ steps.set-output.outputs.filepath }}
        EXPECTED_SHA256: ${{ steps.set-output.outputs.expected_sha256 }}
      run: |
        actual=$(sha256sum -- "$FILEPATH")
        actual=${actual%% *}
        if [ "$actual" != "$EXPECTED_SHA256" ]; then
          printf 'SHA256 mismatch: expected %s, got %s\n' "$EXPECTED_SHA256" "$actual" >&2
          exit 1
        fi
        printf 'SHA256 verified: %s\n' "$actual"
    - if: steps.cache.outputs.cache-hit != 'true'
      name: Save cache
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.set-output.outputs.cache_key }}
        path: ${{ steps.set-output.outputs.filepath }}
